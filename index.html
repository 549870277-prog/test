let hotel={...HOTEL_DEFAULT};try{const saved=JSON.parse(localStorage.getItem('cq-hotel')||'null');if(saved&&typeof saved==='object')for(const k of ['name','address','phone'])if(typeof saved[k]==='string')hotel[k]=saved[k];if(localStorage.getItem('cq-large')==='1')document.body.classList.add('large')}catch(e){}
const now=new Date();const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');let index=today>='2026-10-19'&&today<='2026-10-24'?Number(today.slice(-2))-19:0;let lastFocus;
function steps(list){return '<ol class="steps">'+list.map((t,i)=>'<li><span class="dot">'+(i+1)+'</span><span class="steptext">'+esc(t)+'</span></li>').join('')+'</ol>'}
function taxi(d){return '<div class="card"><h3>累了就打车</h3><p>'+esc(d.taxi)+'</p><p>'+esc(d.estimate)+'</p><p class="muted">预估，以实际为准。酒店位置未确认，以上不是实时报价。</p></div>'}
function back(d){return (d.backNote?'<p>'+esc(d.backNote)+'</p>':'')+((index===5||d.back)?steps(index===5?d.out:d.back):'')}
function food(d,n){return '<article class="card"><span class="tag">'+(n===0?'顺路首选':'附近备选')+'</span><h3>'+esc(d.food[n*2+1])+'</h3><dl><dt>在哪吃</dt><dd>'+esc(d.food[n*2])+'（店名待选）</dd><dt>约走多久</dt><dd>待选定店铺后补充</dd><dt>人均参考</dt><dd>待核实，以菜单为准</dd><dt>推荐点什么</dt><dd>'+esc(d.food[n*2+1])+'</dd></dl></article>'}
function render(){const d=data[index];$('#hero-title').textContent=d.title;$('#hero-sub').textContent=d.sub;$('#date').innerHTML='10月'+(19+index)+'日 '+['周一','周二','周三','周四','周五','周六'][index]+'<small>第 '+(index+1)+' 天 / 共 6 天</small>';$('#prev').disabled=index===0;$('#next').disabled=index===5;$('.daydots').innerHTML=data.map((_,i)=>'<span class="'+(i===index?'active':'')+'"></span>').join('');$('#status').textContent=today<'2026-10-19'?'行程未开始，先看看这六天的安排。':today>'2026-10-24'?'行程已结束，仍可切换日期查看。':('2026-10-'+(19+index)===today?'这是今天的行程。':'正在查看其他日期的行程。');$('#content').innerHTML='<section class="section"><h2 class="heading"><span class="num">01</span>今日提醒</h2><div class="card"><ul class="reminders">'+d.rem.map(t=>'<li><span class="check">✓</span><span>'+esc(t)+'</span></li>').join('')+'</ul><div class="weather"><b>穿衣建议：带薄外套，穿防滑鞋</b><br><span class="muted">建议更新于 10月14日；天气暂无更新，不提供具体预报。</span></div></div></section><section class="section"><h2 class="heading"><span class="num">02</span>今天怎么玩</h2><article class="card"><span class="tag">主要玩</span><h3>'+esc(d.main)+'</h3><div class="timeline">'+d.schedule.map((t,i)=>'<div class="period"><b>'+['上午','午饭','下午'][i]+'</b><span>'+esc(t)+'</span></div>').join('')+'</div>'+(d.optional?'<p class="optional"><b>有精神再顺路看看</b><br>'+esc(d.optional)+'</p>':'')+'<div class="facts">'+d.facts.map((t,i)=>'<div class="fact"><b>'+['看什么','玩多久','台阶与坡道','休息与洗手间'][i]+'</b>'+esc(t)+'</div>').join('')+'</div><p class="rest">累了可提前结束，点底部“看回程”。</p></article></section><section class="section"><h2 class="heading"><span class="num">03</span>怎么坐地铁</h2><div class="notice"><b>路线草稿 · 出发前需要家人核实</b><p>以下路线来自产品文档，站数、方向、出口及酒店步行段尚未全部确认，请勿直接据此出行。</p></div><div class="route-grid" style="margin-top:16px"><article class="card"><div class="route-head"><span class="route-label">去程</span><h3>一步一步走</h3></div>'+steps(d.out)+'</article><article class="card"><div class="route-head"><span class="route-label">'+(index===5?'返武汉':'回程')+'</span><h3>'+(index===5?'去车站，回家':'累了就回酒店')+'</h3></div>'+back(d)+'</article></div></section><section class="section"><h2 class="heading"><span class="num">04</span>今天吃什么</h2><div class="foodgrid">'+food(d,0)+food(d,1)+'</div><div class="order"><b>点单时，把这张卡给店员看</b><blockquote>'+esc(d.order)+'</blockquote><span>谢谢您！</span></div><div class="card" style="margin-top:16px"><h3>顺路小吃</h3><p>'+esc(d.snack)+'</p></div></section>';$('#announce').textContent='已显示10月'+(19+index)+'日，'+d.title;}
function closeModal(){if($('#overlay').hidden)return;$('#overlay').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
function openModal(title,body){lastFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#overlay').hidden=false;document.body.style.overflow='hidden';$('#close').focus()}
$('#prev').onclick=()=>{if(index>0){index--;render();window.scrollTo(0,0)}};$('#next').onclick=()=>{if(index<5){index++;render();window.scrollTo(0,0)}};

$('#hotel').onclick=()=>{openModal('酒店地址','<div class="card hotel-display"><h3 id="hotel-name">'+esc(hotel.name||'酒店名称待补充')+'</h3><p id="hotel-address">'+esc(hotel.address||'详细地址待补充')+'</p><p id="hotel-phone">前台电话：'+esc(hotel.phone||'待补充')+'</p><p class="muted">可把这张卡给司机看。</p></div><form id="hotel-form" class="edit-fields"><h3>家人填写酒店信息</h3><p>仅保存在当前浏览器，不上传。填好酒店后，仍需核对地铁出口与步行路线。</p><label>酒店名称<input name="name" maxlength="100" value="'+esc(hotel.name)+'" placeholder="填写完整酒店名称"></label><label>详细地址<input name="address" maxlength="250" value="'+esc(hotel.address)+'" placeholder="填写街道、门牌号"></label><label>前台电话<input name="phone" type="tel" maxlength="40" value="'+esc(hotel.phone)+'" placeholder="填写前台电话"></label><div class="form-actions"><button class="primary" type="submit">保存酒店信息</button><button type="button" id="export">下载已填写的页面</button></div><p id="save-status" role="status"></p></form>');$('#hotel-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);for(const k of ['name','address','phone'])hotel[k]=String(f.get(k)||'').trim();let message='已保存到当前浏览器。';try{localStorage.setItem('cq-hotel',JSON.stringify(hotel))}catch(err){message='浏览器不允许保存，当前打开期间有效；请下载已填写的页面。'}$('#hotel-name').textContent=hotel.name||'酒店名称待补充';$('#hotel-address').textContent=hotel.address||'详细地址待补充';$('#hotel-phone').textContent='前台电话：'+(hotel.phone||'待补充');$('#save-status').textContent=message};$('#export').onclick=()=>{const f=new FormData($('#hotel-form'));const values={};for(const k of ['name','address','phone'])values[k]=String(f.get(k)||'').trim();const doc=document.documentElement.cloneNode(true);doc.querySelector('#overlay').hidden=true;doc.querySelector('#dialog-body').innerHTML='';doc.querySelector('body').style.overflow='';const script=doc.querySelector('script');script.textContent=script.textContent.replace(/const HOTEL_DEFAULT=[^\n]*;/,'const HOTEL_DEFAULT='+JSON.stringify(values).replace(/</g,'\u003c')+';');const blob=new Blob(['<!DOCTYPE html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='爸妈的重庆行程卡_已填酒店.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#save-status').textContent='已请求下载。微信若不支持下载，请用系统浏览器打开。'}};
$('#close').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeModal()};document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const all=Array.from($('.dialog').querySelectorAll('button,input,[tabindex="0"]')).filter(x=>!x.disabled);const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});sizeLabel();render();
</script></body></html>
